# STEP 12 — Stop secrets from reaching the repository, and catch the ones that
#           already did.
#
# 🎯 GOAL: this is the one that actually causes breaches. Not a clever exploit
#          — an AWS key pasted into a config file "just to test something".
#
# ── The thing beginners get wrong ─────────────────────────────────────────
# Deleting the secret in a follow-up commit DOES NOT REMOVE IT. Git keeps the
# whole history: `git log -p` still shows it, forks still have it, and bots
# scraping GitHub find keys within minutes of a push. The only correct
# response to a committed credential is to ROTATE IT IMMEDIATELY. Cleaning the
# history is optional; rotating is not.
#
# Which is why we scan the full history, not just the diff.
#
# ── Three layers, cheapest first ──────────────────────────────────────────
#   1. Push protection (a GitHub setting, not a workflow) — blocks the push
#      itself. The only layer that prevents the leak rather than reporting it.
#   2. This workflow — gitleaks over the full history on every PR.
#   3. A pre-commit hook on developer machines — see the README.
#
# 📋 SETUP: Settings -> Code security -> enable BOTH "Secret scanning" and
#    "Push protection". Free on public repos. Do this before anything below.
#
# ⚠️ NOTE the checkout has fetch-depth: 0. The default shallow clone fetches
#    ONE commit, so a scanner sees one commit and reports "no leaks found" —
#    a green tick that means nothing at all.
#
# 👀 TRY IT: commit a file containing
#        AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
#    and watch the job go red. (That is AWS's public documentation example
#    key — it is not a real credential.)

name: Step 12 - Secret Scanning

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: 🔑 Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # ⬇️ The line that makes this scan real.
          fetch-depth: 0
          persist-credentials: false

      - name: Scan every commit for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: What to do if this job just failed
        if: failure()
        run: |
          cat <<'GUIDE'
          ❌ A secret was found in this repository's history.

          Do these IN ORDER:

            1. ROTATE THE CREDENTIAL NOW. Assume it is already compromised.
               Deleting the commit does not un-leak it.
            2. Replace it with a GitHub secret and reference it as
               ${{ '${{ secrets.NAME }}' }} in the workflow.
            3. Only then consider rewriting history (git filter-repo / BFG),
               and remember every fork and clone still has the old objects.

          Better still: for AWS, stop storing keys entirely — Step 7's OIDC
          setup means there is no long-lived credential to leak.
          GUIDE
          exit 1

  # ── Verify the repository-level protections are switched on ──────────────
  # A workflow can only catch what is already committed. Push protection stops
  # it landing at all, so this job nags until it is enabled.
  check-push-protection:
    name: 🚧 Push protection reminder
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checklist
        run: |
          {
            echo "### 🚧 Repository security settings"
            echo ""
            echo "Confirm under **Settings -> Code security**:"
            echo ""
            echo "- [ ] Secret scanning: **enabled**"
            echo "- [ ] Push protection: **enabled** (blocks the push itself)"
            echo "- [ ] Dependabot alerts: **enabled**"
            echo "- [ ] Dependabot security updates: **enabled**"
            echo ""
            echo "Push protection is the only one that PREVENTS a leak."
            echo "Everything else, including this workflow, only REPORTS one."
          } >> "$GITHUB_STEP_SUMMARY"
